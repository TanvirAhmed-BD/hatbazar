name: Rename hatbazar.html to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename hatbazar.html to index.html
        run: |
          git config user.name "TanvirAhmed-BD"
          git config user.email "TanvirAhmed-BD@users.noreply.github.com"
          git mv hatbazar.html index.html
          git commit -m "Rename hatbazar.html to index.html"
          git push
